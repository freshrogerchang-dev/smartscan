<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e766e"><title>SmartScan Personal</title><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="SmartScan"><link rel="apple-touch-icon" href="/icon.svg"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f0f7f6;color:#183635}header{background:#0e766e;color:white;padding:24px}main{max-width:760px;margin:auto;padding:14px}section{background:white;border:1px solid #d5e4e2;border-radius:15px;padding:16px;margin-bottom:14px}button,.file{display:inline-block;background:#0e766e;border:0;color:white;border-radius:10px;padding:11px;margin:4px;cursor:pointer}button:disabled{opacity:.45}input[type=file]{display:none}input:not([type=file]),select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border:1px solid #bacac8;border-radius:8px}textarea{height:150px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{height:105px;width:100px;object-fit:contain;background:#eee}.thumbs figure{margin:0;max-width:115px}.thumbs button{padding:5px;font-size:12px}.note{font-size:13px;color:#58716d}#status{font-size:13px;color:#0e766e}</style></head><body><header><h1>SmartScan Personal</h1><div>文件掃描 · OCR · 名片數位化</div></header><main><section><h2>1. 拍照或匯入文件</h2><label class="file" for="camera">📷 拍照</label><input id="camera" type="file" accept="image/*" capture="environment"><label class="file" for="upload">＋ 選取多張</label><input id="upload" type="file" accept="image/*" multiple><div id="pages" class="thumbs"></div><button id="pdf" disabled>匯出多頁 PDF</button><button id="clear">清空</button><p class="note">目前尚無自動裁切／透視修正。</p></section><section><h2>2. OCR 文字辨識</h2><div class="grid"><div><label>語言</label><select id="language"><option value="chi_tra+eng">繁中＋英文</option><option value="eng">英文</option><option value="jpn+eng">日文＋英文</option><option value="chi_tra+eng+jpn">中英日</option></select></div><div><label>模式</label><select id="mode"><option value="document">文件</option><option value="card">名片</option></select></div></div><button id="ocr" disabled>辨識所有圖片</button><p id="status" aria-live="polite"></p><textarea id="text" placeholder="可編輯辨識結果"></textarea><button id="copy">複製</button><button id="translate">Google 翻譯</button></section><section><h2>3. 電子名片</h2><p class="note">辨識結果需人工確認；公司欄位先手動輸入。</p><div class="grid"><div><label>姓名</label><input id="name"></div><div><label>公司</label><input id="company"></div><div><label>電話</label><input id="phone"></div><div><label>Email</label><input id="email"></div></div><button id="vcard">下載 vCard</button></section><section><h2>隱私說明</h2><p class="note">本版不建立帳號、不主動上傳圖片。第三方 CDN 下載程式與 OCR 模型；Google 翻譯會收到送出的文字。此測試版請勿處理病患或機密資料。</p></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="/app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(console.warn))}</script></body></html>
